name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# This lab used to publish with peaceiris/actions-gh-pages, pushing dist/ to a
# gh-pages branch, and that is why its live site served a build from 2026-07-11.
# The repository's Pages source is `build_type: workflow`, which serves ONLY what
# an actions/deploy-pages step uploads -- so each run updated the branch and
# nothing served it.
#
# deploy-sync could not see it either: it keeps a lab only if one of its workflows
# mentions `deploy-pages`, so this lab was never in its denominator.
#
# It now publishes the way 193 labs in the fleet do: `build` runs the same checks
# and uploads a Pages artifact, `deploy` consumes it. That is the shape
# audits/_MASTER-TEMPLATE.md 6.1-6.2 specifies, and every checker can read it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser gate (axe-core WCAG A/AA + functional claims)
        run: npm run test:e2e

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
